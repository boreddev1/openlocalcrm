version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  # "standard" already enables errcheck, govet, ineffassign, staticcheck
  # (which includes the former gosimple) and unused; listed explicitly for clarity.
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - bodyclose
    - misspell
    - unconvert
  settings:
    govet:
      enable:
        - nilness
        - shadow
    gosec:
      excludes:
        - G104 # Audit errors not checked (already caught by errcheck)
        - G204 # Subprocess launched with variable (needed in setup-launcher/updater)
        - G304 # File path provided as taint input (storage and backups require dynamic paths)
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # misspell checks against US English only. These hits are German UI text
      # or API/DB enum values (todo_status CANCELLED) that must not change.
      - linters:
          - misspell
        text: '`(Konfiguration|Initiales|Interaktion|persistente|Analyse|analyse|CANCELLED)`'
      - linters:
          - errcheck
          - gosec
        path: _test\.go
    paths:
      - ^web/
      - ^data/
      - ^backups/

formatters:
  exclusions:
    generated: lax
    paths:
      - ^web/
      - ^data/
      - ^backups/
