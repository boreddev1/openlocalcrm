name: openlocalcrm

services:
  caddy:
    image: caddy:2-alpine
    container_name: crm-proxy
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
    networks:
      - crm-net

  server:
    image: ${CRM_SERVER_IMAGE:-crm-server:local}
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: crm-server
    restart: unless-stopped
    environment:
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL:-postgres://${DB_USER:-crm_user}:${DB_PASSWORD}@db:5432/${DB_NAME:-crm_db}?sslmode=disable}
      - STORAGE_PATH=/data/storage
      - JWT_SECRET_KEY_PATH=/app/keys/ed25519.key
      - DEMO_MODE=${DEMO_MODE:-false}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-admin@openlocalcrm.local}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-}
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4:12b}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-}
      - AI_EMBEDDING_MODEL=${AI_EMBEDDING_MODEL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - CONNECTOR_API_TOKEN=${CONNECTOR_API_TOKEN:-}
    volumes:
      - crm_storage:/data/storage
      - crm_keys:/app/keys
    depends_on:
      db:
        condition: service_healthy
    networks:
      - crm-net

  worker:
    image: ${CRM_WORKER_IMAGE:-crm-worker:local}
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: crm-worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://${DB_USER:-crm_user}:${DB_PASSWORD}@db:5432/${DB_NAME:-crm_db}?sslmode=disable}
      - STORAGE_PATH=/data/storage
    volumes:
      - crm_storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_started
    networks:
      - crm-net

  db:
    image: pgvector/pgvector:pg16
    container_name: crm-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-crm_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - POSTGRES_DB=${DB_NAME:-crm_db}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-crm_user} -d ${DB_NAME:-crm_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crm-net

volumes:
  pg_data:
    name: crm_pg_data
  caddy_data:
    name: crm_caddy_data
  caddy_config:
    name: crm_caddy_config
  crm_storage:
    name: crm_storage
  crm_keys:
    name: crm_keys

networks:
  crm-net:
    driver: bridge
