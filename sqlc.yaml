version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/db/migrations/"
    queries: "internal/db/queries/"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        overrides:
          - db_type: "user_role"
            go_type: "string"
          - db_type: "user_status"
            go_type: "string"
          - db_type: "todo_status"
            go_type: "string"
          - db_type: "todo_priority"
            go_type: "string"
          - db_type: "email_direction"
            go_type: "string"
