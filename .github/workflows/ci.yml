name: CI Test & Quality Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege (issue #107): declare what the workflow actually uses instead of
# inheriting the repo default. Any scope NOT listed here becomes `none`; jobs may
# add narrow scopes they need (see frontend-and-e2e). Do not blanket `write-all`.
permissions:
  contents: read

jobs:
  backend-test:
    name: Go Backend Tests & License Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Verify Go Formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -s -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "❌ Unformatted Go files found:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run Go Vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - name: Run Unit & Integration Tests (with Race Detector)
        run: go test -race -v ./...

      - name: Check Open-Source Licenses
        run: |
          go install github.com/google/go-licenses@latest
          ./scripts/check-licenses.sh

  frontend-and-e2e:
    name: Web Frontend Build & Playwright E2E
    runs-on: ubuntu-latest
    # The audit cross-check needs the Dependabot alerts API (security-events) and
    # the ORPHANED linked-issue check needs issues reads. Everything else keeps the
    # workflow-level `contents: read` (issue #107).
    permissions:
      contents: read
      security-events: read
      issues: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.1
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Web Dependencies
        run: cd web && pnpm install --frozen-lockfile

      - name: Run Security Audit
        env:
          # gh resolves credentials in the order GH_TOKEN > GITHUB_TOKEN > keyring.
          # The runner does NOT export the workflow token into step envs, so the
          # cross-check could never authenticate on CI (issue #107). Passing it as
          # GH_TOKEN changes nothing for local runs, which fall back to the keyring.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Strict mode: a cross-check that cannot verify GitHub's open Dependabot
          # alerts fails the step instead of only warning. Enabled exactly where the
          # workflow token can authenticate: push-to-main and same-repo PRs. Fork PRs
          # and Dependabot-authored PRs run on a non-elevatable read-only token, so
          # they keep the loud-degrade warning path rather than a permanent red.
          # Transient API failures get bounded retries first (see the script).
          WEB_AUDIT_REQUIRE_CROSSCHECK: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
        run: cd web && node ../scripts/check-web-audit.mjs

      - name: Verify Code Formatting (Prettier)
        run: cd web && pnpm format:check

      - name: Run ESLint
        run: cd web && pnpm lint

      - name: Run TypeScript Typecheck
        run: cd web && pnpm typecheck

      - name: Build Web Production Bundle
        run: cd web && pnpm build

      - name: Freshness Gate — committed web/dist must match a fresh build
        shell: bash
        run: |
          cd web
          pnpm build > /dev/null
          cd ..
          STALE=$(git status --porcelain --untracked-files=all -- web/dist)
          if [ -n "$STALE" ]; then
            echo "::error::web/dist in git is STALE: a fresh 'cd web && pnpm build' (pnpm 12.4.1, node 22) produces different output than the committed bundle, so the Go binary would embed an SPA that does not match web/src (violates repo invariant #5). Typical cause: a commit changed web/src, package.json or pnpm-lock.yaml without rebuilding dist."
            echo "Committed dist vs freshly built dist:"
            printf '%s\n' "$STALE"
            echo "Fix: run 'cd web && pnpm install --frozen-lockfile && pnpm build' and commit the resulting web/dist changes."
            exit 1
          fi
          echo "OK: committed web/dist is byte-identical to a fresh production build."

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: ./scripts/run-e2e.sh

      - name: Upload Playwright Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
