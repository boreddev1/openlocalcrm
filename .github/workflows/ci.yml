name: CI Test & Quality Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Go Backend Tests & License Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Verify Go Formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -s -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "❌ Unformatted Go files found:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run Go Vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - name: Run Unit & Integration Tests (with Race Detector)
        run: go test -race -v ./...

      - name: Check Open-Source Licenses
        run: |
          go install github.com/google/go-licenses@latest
          ./scripts/check-licenses.sh

  frontend-and-e2e:
    name: Web Frontend Build & Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.1
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Web Dependencies
        run: cd web && pnpm install --frozen-lockfile

      - name: Run Security Audit
        run: cd web && node ../scripts/check-web-audit.mjs

      - name: Verify Code Formatting (Prettier)
        run: cd web && pnpm format:check

      - name: Run ESLint
        run: cd web && pnpm lint

      - name: Run TypeScript Typecheck
        run: cd web && pnpm typecheck

      - name: Build Web Production Bundle
        run: cd web && pnpm build

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: ./scripts/run-e2e.sh

      - name: Upload Playwright Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
