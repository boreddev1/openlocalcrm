name: Build & Publish Container Images to GHCR

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE: ${{ github.repository }}/server
  WORKER_IMAGE: ${{ github.repository }}/worker

jobs:
  build-and-push:
    name: Build & Push Multi-Arch Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Server Image
      - name: Extract Docker metadata for Server
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.SERVER_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=sha,format=short

      # Build and push Server Image
      - name: Build & Push Server Container
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Extract metadata for Worker Image
      - name: Extract Docker metadata for Worker
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.WORKER_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=sha,format=short

      # Build and push Worker Image
      - name: Build & Push Worker Container
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.worker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-binaries:
    name: Build Standalone Binaries & GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Set up Node.js & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Build Frontend Assets
        run: cd web && pnpm install --frozen-lockfile && pnpm build

      - name: Compile Multi-Platform Standalone Binaries
        run: |
          mkdir -p dist-bin
          LAUNCHER_LDFLAGS="-w -s -X github.com/openlocalcrm/openlocalcrm/internal/launcher.BuildCommit=${{ github.sha }} -X github.com/openlocalcrm/openlocalcrm/internal/launcher.BuildDate=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          # 1. Launcher: Windows AMD64 GUI (silent) & Debug (console)
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="${LAUNCHER_LDFLAGS} -H=windowsgui" -o dist-bin/openlocalcrm-setup.exe ./cmd/setup-launcher
          cp dist-bin/openlocalcrm-setup.exe dist-bin/openlocalcrm-setup-windows-amd64.exe
          cp dist-bin/openlocalcrm-setup.exe dist-bin/mavalio-setup.exe

          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="${LAUNCHER_LDFLAGS}" -o dist-bin/openlocalcrm-setup-debug.exe ./cmd/setup-launcher
          cp dist-bin/openlocalcrm-setup-debug.exe dist-bin/mavalio-setup-debug.exe

          # 2. Launcher: macOS (Apple Silicon & Intel)
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="${LAUNCHER_LDFLAGS}" -o dist-bin/openlocalcrm-setup-darwin-arm64 ./cmd/setup-launcher
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="${LAUNCHER_LDFLAGS}" -o dist-bin/openlocalcrm-setup-darwin-amd64 ./cmd/setup-launcher

          # 3. Launcher: Linux (x86_64 & ARM64)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="${LAUNCHER_LDFLAGS}" -o dist-bin/openlocalcrm-setup-linux-amd64 ./cmd/setup-launcher
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="${LAUNCHER_LDFLAGS}" -o dist-bin/openlocalcrm-setup-linux-arm64 ./cmd/setup-launcher

          # 4. Standalone Server Binaries (Linux & macOS)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o dist-bin/crm-server-linux-amd64 ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-w -s" -o dist-bin/crm-server-linux-arm64 ./cmd/server
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-w -s" -o dist-bin/crm-server-darwin-arm64 ./cmd/server
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-w -s" -o dist-bin/crm-server-darwin-amd64 ./cmd/server

          # 5. Standalone Worker Binaries (Linux & macOS)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o dist-bin/crm-worker-linux-amd64 ./cmd/worker
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-w -s" -o dist-bin/crm-worker-linux-arm64 ./cmd/worker
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-w -s" -o dist-bin/crm-worker-darwin-arm64 ./cmd/worker
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-w -s" -o dist-bin/crm-worker-darwin-amd64 ./cmd/worker

          # 6. Generate SHA256 checksums
          (cd dist-bin && sha256sum * > checksums.txt)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist-bin/*
          generate_release_notes: true
